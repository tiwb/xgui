name: Release to PyPI
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MARKER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
          # tag must sit on the same version line as pyproject (X.Y prefix)
          TAG_LINE=$(cut -d. -f1,2 <<<"$VERSION")
          SRC_LINE=$(cut -d. -f1,2 <<<"$MARKER")
          if [ "$TAG_LINE" != "$SRC_LINE" ]; then
            echo "::error::tag $VERSION is off the source line $SRC_LINE — bump pyproject to the new minor line, or tag ${SRC_LINE}.x"
            exit 1
          fi
          echo "tag $VERSION -> source line $SRC_LINE (ok)"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          find ./src -name '__init__.py' -path '*/src/*' -maxdepth 3 \
            -exec sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" {} +

      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
